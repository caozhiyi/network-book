site_name: 云网络：从隔离到连接
site_description: 从物理网络到云原生网络的演进之旅
site_author: ekko
site_url: https://caozhiyi.cc/network-book/
repo_name: caozhiyi/network-book
repo_url: https://github.com/caozhiyi/network-book

theme:
  name: material
  language: zh
  palette:
    # 浅色模式切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗黑模式
    # 暗黑模式切换
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.indexes # 卷名可点击直接进入导读，支持折叠
    - navigation.top # 返回顶部按钮
    - navigation.footer # 底部翻页组件
    - content.code.copy # 代码块复制按钮
    - content.code.annotate # 代码交互注释

extra:
  analytics:
    provider: google
    property: G-4J919K537P

plugins:
  - search
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
  - social

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list

