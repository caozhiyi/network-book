<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <!-- 背景 -->
  <rect width="900" height="420" rx="12" fill="#fafbfc"/>

  <!-- 阶段标签 -->
  <text x="450" y="32" text-anchor="middle" font-size="11" fill="#6b7280" letter-spacing="2">PHASE 1 · 云内网络的构建</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#6b7280" letter-spacing="2">PHASE 2 · 云与外部世界的连接</text>

  <!-- ═══ 第一行卡片（卷一 → 卷五）═══ -->
  <!-- 卷一 -->
  <rect x="20" y="48" width="156" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="98" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">卷一 · 物理网络</text>
  <line x1="40" y1="80" x2="156" y2="80" stroke="#90caf9" stroke-width="1"/>
  <text x="98" y="100" text-anchor="middle" font-size="10" fill="#1565c0">约束：广播域爆炸</text>
  <text x="98" y="118" text-anchor="middle" font-size="10" fill="#1565c0">方案：Fat Tree</text>
  <text x="98" y="140" text-anchor="middle" font-size="9" fill="#5c6bc0" font-style="italic">↓ 机器太多，广播风暴</text>

  <!-- 卷二 -->
  <rect x="196" y="48" width="156" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="274" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">卷二 · 多租户隔离</text>
  <line x1="216" y1="80" x2="332" y2="80" stroke="#90caf9" stroke-width="1"/>
  <text x="274" y="100" text-anchor="middle" font-size="10" fill="#1565c0">约束：4096 VNI 上限</text>
  <text x="274" y="118" text-anchor="middle" font-size="10" fill="#1565c0">方案：VxLAN</text>
  <text x="274" y="140" text-anchor="middle" font-size="9" fill="#5c6bc0" font-style="italic">↓ 隔离够了，但通信效率低</text>

  <!-- 卷三 -->
  <rect x="372" y="48" width="156" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">卷三 · VPC 内通信</text>
  <line x1="392" y1="80" x2="508" y2="80" stroke="#90caf9" stroke-width="1"/>
  <text x="450" y="100" text-anchor="middle" font-size="10" fill="#1565c0">约束：集中网关瓶颈</text>
  <text x="450" y="118" text-anchor="middle" font-size="10" fill="#1565c0">方案：分布式网关</text>
  <text x="450" y="140" text-anchor="middle" font-size="9" fill="#5c6bc0" font-style="italic">↓ 内部通了，但出不去公网</text>

  <!-- 卷四 -->
  <rect x="548" y="48" width="156" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="626" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">卷四 · 公网连接</text>
  <line x1="568" y1="80" x2="684" y2="80" stroke="#90caf9" stroke-width="1"/>
  <text x="626" y="100" text-anchor="middle" font-size="10" fill="#1565c0">约束：地址冲突</text>
  <text x="626" y="118" text-anchor="middle" font-size="10" fill="#1565c0">方案：NAT / EIP / LB</text>
  <text x="626" y="140" text-anchor="middle" font-size="9" fill="#5c6bc0" font-style="italic">↓ 能上网了，但 VPC 间不通</text>

  <!-- 卷五 -->
  <rect x="724" y="48" width="156" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="802" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">卷五 · VPC 互联</text>
  <line x1="744" y1="80" x2="860" y2="80" stroke="#90caf9" stroke-width="1"/>
  <text x="802" y="100" text-anchor="middle" font-size="10" fill="#1565c0">约束：N² 连接爆炸</text>
  <text x="802" y="118" text-anchor="middle" font-size="10" fill="#1565c0">方案：Peering / 云联网</text>

  <!-- ═══ 第一行箭头连接 ═══ -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1565c0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#e65100"/>
    </marker>
    <marker id="arrow-turn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7b1fa2"/>
    </marker>
  </defs>

  <line x1="176" y1="98" x2="194" y2="98" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="352" y1="98" x2="370" y2="98" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="528" y1="98" x2="546" y2="98" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="704" y1="98" x2="722" y2="98" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ 转弯连接（卷五 → 卷六）═══ -->
  <path d="M 802 148 L 802 190 Q 802 200 792 200 L 128 200 Q 118 200 118 210 L 118 240" 
        fill="none" stroke="#7b1fa2" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow-turn)"/>
  <rect x="380" y="186" width="180" height="24" rx="12" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="470" y="203" text-anchor="middle" font-size="10" fill="#7b1fa2" font-weight="bold">云内通了，但 IDC 还没接入</text>

  <!-- ═══ 第二行卡片（卷六 → 卷九，从左到右）═══ -->
  <!-- 卷六 -->
  <rect x="20" y="240" width="156" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="98" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">卷六 · 混合云</text>
  <line x1="40" y1="272" x2="156" y2="272" stroke="#ffcc80" stroke-width="1"/>
  <text x="98" y="292" text-anchor="middle" font-size="10" fill="#e65100">约束：公网不可信</text>
  <text x="98" y="310" text-anchor="middle" font-size="10" fill="#e65100">方案：VPN / 专线</text>
  <text x="98" y="332" text-anchor="middle" font-size="9" fill="#f57c00" font-style="italic">↓ 连通了，但全球用户慢</text>

  <!-- 卷七 -->
  <rect x="196" y="240" width="156" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="274" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">卷七 · 全球加速</text>
  <line x1="216" y1="272" x2="332" y2="272" stroke="#ffcc80" stroke-width="1"/>
  <text x="274" y="292" text-anchor="middle" font-size="10" fill="#e65100">约束：延迟与距离</text>
  <text x="274" y="310" text-anchor="middle" font-size="10" fill="#e65100">方案：Anycast / CDN</text>
  <text x="274" y="332" text-anchor="middle" font-size="9" fill="#f57c00" font-style="italic">↓ 快了，但暴露面太大</text>

  <!-- 卷八 -->
  <rect x="372" y="240" width="156" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">卷八 · 安全防护</text>
  <line x1="392" y1="272" x2="508" y2="272" stroke="#ffcc80" stroke-width="1"/>
  <text x="450" y="292" text-anchor="middle" font-size="10" fill="#e65100">约束：攻击面扩大</text>
  <text x="450" y="310" text-anchor="middle" font-size="10" fill="#e65100">方案：DDoS / WAF</text>
  <text x="450" y="332" text-anchor="middle" font-size="9" fill="#f57c00" font-style="italic">↓ 安全了，但出问题看不见</text>

  <!-- 卷九 -->
  <rect x="548" y="240" width="156" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="626" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">卷九 · 可观测与治理</text>
  <line x1="568" y1="272" x2="684" y2="272" stroke="#ffcc80" stroke-width="1"/>
  <text x="626" y="292" text-anchor="middle" font-size="10" fill="#e65100">约束：黑盒不可运维</text>
  <text x="626" y="310" text-anchor="middle" font-size="10" fill="#e65100">方案：Flow Log / 服务网格</text>

  <!-- 第二行箭头连接 -->
  <line x1="176" y1="290" x2="194" y2="290" stroke="#e65100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="352" y1="290" x2="370" y2="290" stroke="#e65100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="528" y1="290" x2="546" y2="290" stroke="#e65100" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ═══ 图例 ═══ -->
  <rect x="20" y="365" width="860" height="35" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40" y="375" width="14" height="14" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="386" font-size="10" fill="#424242">云内构建（卷一~五）</text>
  <rect x="200" y="375" width="14" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="220" y="386" font-size="10" fill="#424242">云外连接（卷六~九）</text>
  <line x1="380" y1="382" x2="410" y2="382" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="416" y="386" font-size="10" fill="#424242">阶段跃迁（核心矛盾驱动）</text>
</svg>
